name: Campaign verification

on:
  pull_request:
    paths:
      - 'signal_agent/campaigns/**'
      - 'signal_agent/governed_authoring/**'
      - 'signal_agent/formal_governance/**'
      - 'app/hq/governance/**'
      - 'app/utils/**'
      - 'shared/**'
      - 'config/**'
      - 'schemas/**'
      - 'tests/**'
      - 'examples/campaigns/**'
      - 'scripts/benchmark_campaigns.py'
      - 'scripts/campaign_trial.py'
      - 'requirements-campaigns-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/campaign-verification.yml'
  push:
    branches: [main, feature/campaign-principles-traversal]
    paths:
      - 'signal_agent/**'
      - 'app/hq/governance/**'
      - 'app/utils/**'
      - 'shared/**'
      - 'config/**'
      - 'schemas/**'
      - 'tests/**'
      - 'examples/campaigns/**'
      - 'scripts/benchmark_campaigns.py'
      - 'scripts/campaign_trial.py'
      - 'requirements-campaigns-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/campaign-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-campaigns-dev.txt
      - name: Install declared test dependencies
        run: python -m pip install -r requirements-campaigns-dev.txt
      - name: Verify campaign and governed authoring behavior
        run: >-
          python -m pytest -q
          tests/test_campaign_decisions.py
          tests/test_campaign_handoff.py
          tests/test_campaign_transport.py
          tests/test_governed_authoring_backend.py
          tests/test_governed_authoring_workspace.py
          tests/test_governed_authoring_path_policy.py
          tests/test_formal_governance_models.py
          tests/test_formal_governance_decision.py
          tests/test_formal_governance_ledger.py
          tests/test_hq_transition_gate.py
      - name: Run the controlled local campaign trial
        run: python scripts/campaign_trial.py
      - name: Measure bounded campaign histories
        run: python scripts/benchmark_campaigns.py --iterations 10
