pack_metadata:
  name: linkedin_clean
  scope: DOMAIN
  version: 1.0.0
  pack_hash: sha256:ba1a5c44220dc318b9495f0b24c5d49c6a6c3cfa020417d5ba528a6096be2c58
  compatibility: SIGNAL_AGENT_MODULES_V1
  template_base: CONTENT_MEME_OFFLOAD_v1
activation_conditions:
  domain_match:
  - content
  platform_hint: linkedin
canvas_defaults:
  w: 1200
  h: 1200
  bg: '#f5f5f5'
format_defaults:
  format: infographic_list
  render_mode: svg
constraint_rules:
- constraint_id: MEME_ALLOW_OFFLOAD
  scope: DOMAIN
  intent: Allow CONTENT_MEME_OFFLOAD action within content domain
  rule_type: ALLOW
  trigger:
    capability_id: content:meme_offload
    risk_tier: LOW
  predicate: {}
  enforcement_action: LOG_ONLY
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
- constraint_id: MEME_LIMIT_MAX_OUTPUTS
  scope: DOMAIN
  intent: Cap meme outputs per invocation
  rule_type: LIMIT
  trigger:
    capability_id: content:meme_offload
    risk_tier: ANY
  predicate: {}
  parameters:
    metric_id: meme_output_count
    selector_key: content:meme_offload
    max_value: 3
  enforcement_action: BLOCK
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
- constraint_id: MEME_DENY_NAMED_PERSON
  scope: DOMAIN
  intent: Block meme generation containing named persons
  rule_type: DENY
  trigger:
    capability_id: content:meme_offload
    risk_tier: HIGH
  predicate:
    op: EQ
    left: snapshot.contains_named_person
    right: true
  enforcement_action: BLOCK
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
- constraint_id: MEME_DENY_DISALLOWED_TERMS
  scope: DOMAIN
  intent: Block meme generation containing disallowed terms
  rule_type: DENY
  trigger:
    capability_id: content:meme_offload
    risk_tier: HIGH
  predicate:
    op: EQ
    left: snapshot.contains_disallowed_terms
    right: true
  enforcement_action: BLOCK
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
- constraint_id: LINKEDIN_DENY_BULLET_LENGTH
  scope: DOMAIN
  intent: "LinkedIn clean: shorter bullets \xE2\u20AC\u201D max 60 chars"
  rule_type: DENY
  trigger:
    capability_id: content:meme_offload
    risk_tier: MEDIUM
  predicate:
    op: OR
    args:
    - op: GT
      left: snapshot.title_chars
      right: 60
    - op: GT
      left: snapshot.max_bullet_chars
      right: 60
  enforcement_action: BLOCK
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
- constraint_id: MEME_ALLOW_PROVIDER_EXPANSION
  scope: DOMAIN
  intent: Gate optional LLM caption expansion (disabled by default)
  rule_type: ALLOW
  trigger:
    capability_id: content:meme_offload
    risk_tier: MEDIUM
  predicate: 'false'
  enforcement_action: LOG_ONLY
  audit_event: MEME_POLICY_EVALUATION
  rollback_behavior: ABORT
